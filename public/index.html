const { useState, useEffect, useMemo, useRef, createContext, useContext } = React;

// ===================================================================
// STORAGE LAYER
// ===================================================================
// === BACKEND HÍBRIDO ====================================================
// "storage" agora é um cache EM MEMÓRIA, populado por /api/bootstrap.
// Quem precisar lembrar entre sessões (preferências locais como darkMode,
// onboarded, dark, currency, rates) continua usando localStorage via a
// chave "localOnly" — backend não se mete nisso.
// =======================================================================
const LOCAL_ONLY_KEYS = new Set(['dark','currency','rates','seeded']);
const _cache = {};
const K = (k) => `wp_${k}`;
const storage = {
  get(k, fb) {
    if (LOCAL_ONLY_KEYS.has(k)) {
      try { const v = localStorage.getItem(K(k)); return v === null ? fb : JSON.parse(v); }
      catch { return fb; }
    }
    if (k in _cache) return _cache[k];
    return fb;
  },
  set(k, v) {
    if (LOCAL_ONLY_KEYS.has(k)) {
      try { localStorage.setItem(K(k), JSON.stringify(v)); } catch {}
      return;
    }
    _cache[k] = v;
    // Mudanças nas coleções (users, tasks, etc) que vêm do servidor
    // NÃO são re-sincronizadas a cada keystroke. Operações específicas
    // (addTask, updateUser, etc) chamam fetch direto. O cache aqui é
    // só pra useStorageState não regredir entre re-renders.
  },
  // Populado pelo bootstrap
  _seed(data) {
    Object.assign(_cache, data);
  },
};

const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const now = () => Date.now();
// Default rates (fallback if API fails). Updated periodically by fetchRates().
const DEFAULT_RATES = { BRL: 1, USD: 0.18, EUR: 0.17, GBP: 0.14 };
const CURRENCY_SYMBOLS = { BRL: 'R$', USD: '$', EUR: '€', GBP: '£' };
const CURRENCY_LOCALES = { BRL: 'pt-BR', USD: 'en-US', EUR: 'de-DE', GBP: 'en-GB' };

function getCurrency() { try { return JSON.parse(localStorage.getItem('wp_currency')) || 'BRL'; } catch { return 'BRL'; } }
function getRates() { try { return JSON.parse(localStorage.getItem('wp_rates')) || DEFAULT_RATES; } catch { return DEFAULT_RATES; } }

async function fetchRates() {
  try {
    const r = await fetch('https://economia.awesomeapi.com.br/json/last/USD-BRL,EUR-BRL,GBP-BRL', { cache: 'no-store' });
    const d = await r.json();
    const usdToBrl = parseFloat(d.USDBRL?.bid || 5.5);
    const eurToBrl = parseFloat(d.EURBRL?.bid || 6.0);
    const gbpToBrl = parseFloat(d.GBPBRL?.bid || 7.0);
    const rates = { BRL: 1, USD: 1/usdToBrl, EUR: 1/eurToBrl, GBP: 1/gbpToBrl };
    localStorage.setItem('wp_rates', JSON.stringify(rates));
    return rates;
  } catch { return getRates(); }
}

const money = (n) => {
  const c = getCurrency();
  const rates = getRates();
  const v = Number(n||0) * (rates[c] || 1);
  return `${CURRENCY_SYMBOLS[c]} ${v.toLocaleString(CURRENCY_LOCALES[c], { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
};
const moneyShort = (n) => {
  const c = getCurrency();
  const rates = getRates();
  const v = Number(n||0) * (rates[c] || 1);
  return `${CURRENCY_SYMBOLS[c]} ${v.toLocaleString(CURRENCY_LOCALES[c], { maximumFractionDigits: 0 })}`;
};
const ago = (ts) => {
  const d = (Date.now() - ts) / 1000;
  if (d < 60) return 'agora mesmo';
  if (d < 3600) return `há ${Math.floor(d/60)} min`;
  if (d < 86400) return `há ${Math.floor(d/3600)} h`;
  if (d < 86400*30) return `há ${Math.floor(d/86400)} dias`;
  return new Date(ts).toLocaleDateString('pt-BR');
};
const initials = (s) => (s||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();

function readFileAsDataURL(file, maxMB = 5) {
  return new Promise((resolve, reject) => {
    if (file.size > maxMB * 1024 * 1024) return reject(new Error(`Arquivo maior que ${maxMB}MB`));
    const reader = new FileReader();
    reader.onload = (e) => resolve({
      dataUrl: e.target.result,
      name: file.name,
      mime: file.type,
      size: file.size,
    });
    reader.onerror = () => reject(new Error('Erro ao ler arquivo'));
    reader.readAsDataURL(file);
  });
}

const fmtBytes = (n) => n < 1024 ? n+' B' : n < 1024*1024 ? (n/1024).toFixed(1)+' KB' : (n/1024/1024).toFixed(1)+' MB';

function readImageResized(file, maxW, maxH) {
  return new Promise((resolve, reject) => {
    if (!file.type.startsWith('image/')) return reject(new Error('Arquivo não é uma imagem'));
    if (file.size > 8 * 1024 * 1024) return reject(new Error('Imagem maior que 8MB'));
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        const ratio = Math.min(maxW / width, maxH / height, 1);
        width = Math.round(width * ratio);
        height = Math.round(height * ratio);
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = () => reject(new Error('Imagem inválida'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('Erro ao ler arquivo'));
    reader.readAsDataURL(file);
  });
}

function matchesCategory(user, catKey) {
  const cat = CATEGORY_CHIPS.find(c => c.key === catKey);
  if (!cat) return true;
  const hay = [...(user.skills||[]), user.bio||'', user.name||''].join(' ').toLowerCase();
  return cat.match.some(term => hay.includes(term.toLowerCase()));
}

// "AI" — heurística por categoria
function analyzeTask({ title, description, category }) {
  const text = `${title} ${description}`.toLowerCase();
  const len = text.length;
  let complexity = 'Média';
  if (len < 80) complexity = 'Baixa';
  else if (len > 280 || /(complex|enterprise|integra|múltipl|migra|migração|escalá)/.test(text)) complexity = 'Alta';

  const baseHours = { 'Baixa': 4, 'Média': 8, 'Alta': 24 }[complexity];
  const rates = {
    Design: 100, Desenvolvimento: 180, Marketing: 120, 'Redação': 90,
    'Vídeo': 130, Consultoria: 220, 'Tradução': 80, Outros: 110
  };
  const rate = rates[category] || 100;
  const price = Math.round(baseHours * rate / 50) * 50;

  const briefing =
`Objetivo: ${title}

Contexto fornecido: ${description}

Entregáveis esperados:
• Solução completa para o problema descrito acima
• Arquivos/documentação no formato adequado à categoria "${category}"
• Até 2 rodadas de ajustes conforme feedback

Critérios de aceite:
• Qualidade profissional compatível com a categoria
• Comunicação clara durante a execução
• Entrega dentro do prazo estimado de ${baseHours}h`;

  const baseChecklist = [
    'Alinhamento inicial sobre objetivos e escopo',
    'Pesquisa de referência específica para o projeto',
    'Primeira entrega para validação',
    'Revisões com base no feedback',
    'Entrega final com todos os ativos',
  ];
  const adds = {
    Design: ['Apresentação de 3 direções visuais'],
    Desenvolvimento: ['Setup de ambiente e arquitetura', 'Testes e QA antes da entrega'],
    Marketing: ['Definição de KPIs e métricas de sucesso'],
    'Vídeo': ['Roteiro aprovado antes da gravação'],
    Consultoria: ['Diagnóstico inicial e plano de ação'],
    'Redação': ['Definição de tom de voz e público-alvo'],
  };
  const checklist = [...baseChecklist];
  if (adds[category]) checklist.splice(2, 0, ...adds[category]);

  return {
    complexity,
    estimatedHours: baseHours,
    suggestedPrice: price,
    briefing,
    checklist: checklist.map(t => ({ id: uid(), text: t, done: false })),
  };
}

function moderate(text) {

  const found = BANNED_WORDS.filter(w => t.includes(w));

const SEED_IDS = ['u_ana','u_beto','u_clara','u_diego','u_cafefoco','u_mariana'];

function migrateSeedFlags() {
  // Ensure existing seed users get isSeed:true + verified:true even if seeded already ran before this flag existed.
  const users = storage.get('users', []);
  let changed = false;
  const migrated = users.map(u => {
    if (SEED_IDS.includes(u.id) && (!u.isSeed || u.verified === undefined)) {
      changed = true;
      return { ...u, isSeed: true, verified: true, verifiedAt: u.verifiedAt || u.createdAt || now() };
    }
    return u;
  });
  if (changed) storage.set('users', migrated);
}

function useStorageState(key, fallback) {
  const [v, setV] = useState(() => storage.get(key, fallback));
  useEffect(() => { storage.set(key, v); }, [key, v]);
  return [v, setV];
}

// ===================================================================
// TOAST SYSTEM
// ===================================================================
const ToastCtx = createContext(null);
const useToast = () => useContext(ToastCtx) || { show: () => {} };

function ToastProvider({ children }) {
  const [toasts, setToasts] = useState([]);
  function show(text, type = 'success', duration = 2800) {
    const id = uid();
    setToasts(t => [...t, { id, text, type }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), duration);
  }
  const ctx = {
    show,
    success: (t) => show(t, 'success'),
    error: (t) => show(t, 'error', 4000),
    info: (t) => show(t, 'info'),
  };
  return (
    <ToastCtx.Provider value={ctx}>
      {children}
      <div className="fixed top-4 left-0 right-0 z-[60] flex flex-col items-center gap-2 pointer-events-none px-4">
        {toasts.map(t => {
          const styles = {
            success: 'bg-brand-500 text-white',
            error:   'bg-rose-500 text-white',
            info:    'bg-ink text-white dark:bg-white dark:text-ink',
          };
          const icons = { success: 'check', error: 'x', info: 'sparkles' };
          return (
            <div key={t.id} className={`pointer-events-auto px-4 py-3 rounded-2xl shadow-ios-lg flex items-center gap-2 ${styles[t.type]} max-w-md scale-in`}>
              <Icon name={icons[t.type]} className="w-4 h-4" strokeWidth={2.6}/>
              <span className="text-sm font-medium">{t.text}</span>
            </div>
          );
        })}
      </div>
    </ToastCtx.Provider>
  );
}

function CurrencyToggle() {
  const [c, setC] = useState(getCurrency());
  const [open, setOpen] = useState(false);
  const toast = useToast();
  useEffect(() => {
    fetchRates().then(() => setC(getCurrency()));
  }, []);
  function pick(cur) {
    localStorage.setItem('wp_currency', JSON.stringify(cur));
    setC(cur); setOpen(false);
    toast.success(`Moeda alterada para ${cur} (referência — pagamento sempre em BRL)`);
    window.dispatchEvent(new Event('storage'));
    setTimeout(() => location.reload(), 600);
  }
  const options = ['BRL','USD','EUR','GBP'];
  return (
    <div className="border-b border-black/5 dark:border-white/10">
      <button onClick={() => setOpen(!open)} className="w-full text-left p-4 hover:bg-mist dark:hover:bg-white/5 flex items-center gap-3">
        <Icon name="dollar" className="w-5 h-5 text-ink/55 dark:text-white/55"/>
        <span className="flex-1 font-medium">Moeda de exibição</span>
        <span className="text-sm font-semibold text-brand-600">{c}</span>
        <Icon name="chevronRight" className={`w-4 h-4 text-ink/30 transition-transform ${open?'rotate-90':''}`}/>
      </button>
      {open && (
        <div className="px-4 pb-3 grid grid-cols-4 gap-2">
          {options.map(o => (
            <button key={o} onClick={() => pick(o)}
              className={`tappable py-2 rounded-xl text-sm font-semibold border ${c===o?'bg-brand-500 text-white border-brand-500':'border-black/10 dark:border-white/15 text-ink dark:text-white'}`}>{o}</button>
          ))}
        </div>
      )}
      {open && <p className="text-[10px] text-ink/45 dark:text-white/45 px-4 pb-3">⚠ Pagamento sempre processado em BRL. Outras moedas são apenas referência (cotação atualizada via AwesomeAPI).</p>}
    </div>
  );
}

const ONBOARDING_SLIDES = [
  {
    icon: 'sparkles',
    title: 'IA que estrutura o trabalho',
    desc: 'Descreva o que precisa em 1 frase. A IA define escopo, prazo, checklist e preço justo — em segundos.',

    desc: 'O valor fica retido. Só libera quando a empresa aprovar a entrega. Sem golpe, sem dor de cabeça.',
  },

function Onboarding({ onClose }) {
  const [i, setI] = useState(0);
  const slide = ONBOARDING_SLIDES[i];
  const isLast = i === ONBOARDING_SLIDES.length - 1;
  return (
    <div className="fixed inset-0 z-[55] bg-black/60 backdrop-blur-md flex items-center justify-center p-4 fade-in">
      <div className="glass-strong rounded-ios-lg shadow-ios-lg max-w-md w-full overflow-hidden scale-in">
        <div className="h-2 bg-black/[0.06] dark:bg-white/10">
          <div className="h-full bg-brand-500 transition-all" style={{width: `${((i+1)/ONBOARDING_SLIDES.length)*100}%`}}/>
        </div>
        <div className="p-8 text-center">
          <div className="w-20 h-20 mx-auto rounded-3xl bg-brand-500 text-white flex items-center justify-center shadow-[0_8px_28px_rgba(16,183,127,0.45)] mb-5">
            <Icon name={slide.icon} className="w-10 h-10" strokeWidth={2.2}/>
          </div>
          <h2 className="text-2xl font-bold tracking-tight mb-2">{slide.title}</h2>
          <p className="text-ink/70 dark:text-white/70 leading-relaxed">{slide.desc}</p>
          <div className="flex items-center justify-center gap-1.5 mt-6">
            {ONBOARDING_SLIDES.map((_, idx) => (
              <div key={idx} className={`h-1.5 rounded-full transition-all ${idx===i?'w-6 bg-brand-500':'w-1.5 bg-black/15 dark:bg-white/20'}`}/>
            ))}
          </div>
        </div>
        <div className="p-4 pt-0 flex gap-2">
          {i > 0 && <Button variant="secondary" className="flex-1" onClick={() => setI(i-1)}>Voltar</Button>}
          <Button className="flex-1" onClick={() => isLast ? onClose() : setI(i+1)}>{isLast ? 'Começar' : 'Próximo'}</Button>
        </div>
        {!isLast && <button onClick={onClose} className="block mx-auto pb-4 text-xs text-ink/50 dark:text-white/50">Pular</button>}
      </div>
    </div>
  );
}

function maskDoc(value, isCnpj) {
  const d = (value || '').replace(/\D/g, '').slice(0, isCnpj ? 14 : 11);
  if (isCnpj) {
    return d
      .replace(/(\d{2})(\d)/, '$1.$2')
      .replace(/(\d{3})(\d)/, '$1.$2')
      .replace(/(\d{3})(\d)/, '$1/$2')
      .replace(/(\d{4})(\d)/, '$1-$2');
  }
  return d
    .replace(/(\d{3})(\d)/, '$1.$2')
    .replace(/(\d{3})(\d)/, '$1.$2')
    .replace(/(\d{3})(\d)/, '$1-$2');
}
// Validação completa (matemática) de CPF/CNPJ — mesma lógica do servidor.
// Server tem a Camada 2 (BrasilAPI pra CNPJ) que cliente não tem.
function _validCPF(d) {
  if (d.length !== 11) return false;
  if (/^(\d)\1+$/.test(d)) return false;
  let sum = 0;
  for (let i = 0; i < 9; i++) sum += parseInt(d[i]) * (10 - i);
  let mod = (sum * 10) % 11; if (mod === 10) mod = 0;
  if (mod !== parseInt(d[9])) return false;
  sum = 0;
  for (let i = 0; i < 10; i++) sum += parseInt(d[i]) * (11 - i);
  mod = (sum * 10) % 11; if (mod === 10) mod = 0;
  return mod === parseInt(d[10]);
}
function _validCNPJ(d) {
  if (d.length !== 14) return false;
  if (/^(\d)\1+$/.test(d)) return false;
  const w1 = [5,4,3,2,9,8,7,6,5,4,3,2];
  let sum = 0;
  for (let i = 0; i < 12; i++) sum += parseInt(d[i]) * w1[i];
  let mod = sum % 11;
  const dv1 = mod < 2 ? 0 : 11 - mod;
  if (dv1 !== parseInt(d[12])) return false;
  const w2 = [6,5,4,3,2,9,8,7,6,5,4,3,2];
  sum = 0;
  for (let i = 0; i < 13; i++) sum += parseInt(d[i]) * w2[i];
  mod = sum % 11;
  const dv2 = mod < 2 ? 0 : 11 - mod;
  return dv2 === parseInt(d[13]);
}
function validateDoc(value, isCnpj) {
  const d = (value || '').replace(/\D/g, '');
  if (d.length !== (isCnpj ? 14 : 11)) return false;
  return isCnpj ? _validCNPJ(d) : _validCPF(d);
}

function Dashboard({ user, tasks, transactions, setView }) {

  const activeOwn = myTasks.filter(t => !['concluida','cancelada','rascunho'].includes(t.status));
  const doneOwn = myTasks.filter(t => t.status === 'concluida');
  const myTx = transactions.filter(t => t.fromId === user.id);
  const totalSpent = myTx.reduce((s,t) => s + t.gross, 0);

  const earnings = transactions.filter(t => t.toId === user.id);
  const totalEarned = earnings.filter(t => t.status === 'pago').reduce((s,t) => s + t.net, 0);
  const inEscrow = earnings.filter(t => t.status === 'em_custodia').reduce((s,t) => s + t.net, 0);

function TarefaDetalhe({ user, taskId, tasks, updateTask, addTransaction, addReview, reviews, transactions, users, addNotification, setView }) {
  const task = tasks.find(t => t.id === taskId);
  const [reviewModal, setReviewModal] = useState(false);
  const [reviewForm, setReviewForm] = useState({ rating: 5, comment: '' });
  const [deliverModal, setDeliverModal] = useState(false);
  const [deliverForm, setDeliverForm] = useState({ summary: '', files: [] });
  const [revisionModal, setRevisionModal] = useState(false);
  const [revisionText, setRevisionText] = useState('');
  const [qModal, setQModal] = useState(false);
  const [qText, setQText] = useState('');
  const deliverFileRef = useRef(null);
  const toast = useToast();

  if (!task) return <div className="text-center py-12">Tarefa não encontrada.</div>;
  const owner = users.find(u => u.id === task.ownerId);
  const assignee = task.assigneeId ? users.find(u => u.id === task.assigneeId) : null;
  const status = TASK_STATUS[task.status];
  const isOwner = user.id === task.ownerId;
  const isAssignee = user.id === task.assigneeId;
  const myReview = reviews.find(r => r.taskId === task.id && r.reviewerId === user.id);
  const taskReviews = reviews.filter(r => r.taskId === task.id);
  const tx = transactions.find(t => t.taskId === task.id);

  // auto-prompt rating after completion
  useEffect(() => {
    if (task && task.status === 'concluida' && !myReview && (isOwner || isAssignee)) {
      const promptKey = `wp_rated_prompt_${task.id}_${user.id}`;
      if (!localStorage.getItem(promptKey)) {
        const t = setTimeout(() => { setReviewModal(true); localStorage.setItem(promptKey, '1'); }, 600);
        return () => clearTimeout(t);
      }
    }
  }, [task?.status, !!myReview]);

  const deliveries = task.deliveries || [];
  const lastDelivery = deliveries[deliveries.length - 1];
  const maxRevisions = task.maxRevisions ?? 2;
  const revisionCount = deliveries.filter(d => d.status === 'revisao_solicitada').length;
  const questions = task.questions || [];

  function toggleChecklist(id) {
    if (!isAssignee && !isOwner) return;
    updateTask({
      ...task,
      checklist: task.checklist.map(c => c.id === id ? { ...c, done: !c.done } : c)
    });
  }

  function takeTask() {
    updateTask({ ...task, status:'em_andamento', assigneeId: user.id });
    addNotification(task.ownerId, `${user.name} aceitou sua tarefa "${task.title}"`);
    // criar transação em escrow
    addTransaction({
      id: uid(), taskId: task.id, fromId: task.ownerId, toId: user.id,
      gross: task.finalPrice, fee: Math.round(task.finalPrice * COMMISSION_RATE),
      net: task.finalPrice - Math.round(task.finalPrice * COMMISSION_RATE),
      status:'em_custodia', createdAt: now()
    });
  }

  async function onDeliveryPickFiles(e) {
    const files = [...(e.target.files || [])];
    const results = [];
    for (const f of files) {
      try {
        const r = await readFileAsDataURL(f, 5);
        results.push(r);
      } catch (err) { toast.error(err.message); }
    }
    setDeliverForm({ ...deliverForm, files: [...deliverForm.files, ...results] });
    e.target.value = '';
  }

  function submitDelivery() {
    if (!deliverForm.summary.trim()) { toast.error('Descreva o que foi entregue'); return; }
    const newDelivery = {
      id: uid(), version: deliveries.length + 1,
      summary: deliverForm.summary.trim(), files: deliverForm.files,
      status: 'aguardando_aprovacao', createdAt: now(),
    };
    updateTask({ ...task, status:'em_revisao', deliveries: [...deliveries, newDelivery] });
    addNotification(task.ownerId, `${user.name} entregou a versão ${newDelivery.version} de "${task.title}"`);
    toast.success('Entrega enviada');
    setDeliverModal(false);
    setDeliverForm({ summary: '', files: [] });
  }

  function approve() {
    const updatedDeliveries = deliveries.map((d,i) => i === deliveries.length - 1 ? { ...d, status: 'aprovada', decidedAt: now() } : d);
    updateTask({ ...task, status:'concluida', completedAt: now(), deliveries: updatedDeliveries });
    if (tx) addTransaction({ ...tx, status:'liberado', releasedAt: now() }, true);
    addNotification(task.assigneeId, `Sua entrega de "${task.title}" foi aprovada. Valor liberado para saque.`);
    toast.success('Entrega aprovada e pagamento liberado');
  }

  function requestRevision() {
    if (!revisionText.trim()) { toast.error('Descreva o que precisa de ajuste'); return; }
    if (revisionCount >= maxRevisions) { toast.error(`Limite de ${maxRevisions} revisões atingido`); return; }
    const updatedDeliveries = deliveries.map((d,i) => i === deliveries.length - 1 ? { ...d, status: 'revisao_solicitada', revisionNote: revisionText.trim(), decidedAt: now() } : d);
    updateTask({ ...task, status:'em_andamento', deliveries: updatedDeliveries });
    addNotification(task.assigneeId, `${user.name} pediu ajustes em "${task.title}"`);
    toast.info('Pedido de revisão enviado');
    setRevisionModal(false);
    setRevisionText('');
  }

  function askQuestion() {
    if (!qText.trim()) { toast.error('Escreva sua pergunta'); return; }
    const myCount = questions.filter(q => q.askerId === user.id).length;
    if (myCount >= 3) { toast.error('Limite de 3 perguntas por tarefa'); return; }
    const newQ = { id: uid(), askerId: user.id, text: qText.trim(), answer: null, isPublic: false, createdAt: now() };
    updateTask({ ...task, questions: [...questions, newQ] });
    addNotification(task.ownerId, `${user.name} fez uma pergunta na sua tarefa "${task.title}"`);
    toast.success('Pergunta enviada');
    setQText('');
    setQModal(false);
  }

  function answerQuestion(qid, answer) {
    if (!answer.trim()) return;
    updateTask({ ...task, questions: questions.map(q => q.id === qid ? { ...q, answer: answer.trim(), answeredAt: now() } : q) });
    const q = questions.find(x => x.id === qid);
    if (q) addNotification(q.askerId, `${user.name} respondeu sua pergunta em "${task.title}"`);
    toast.success('Resposta enviada');
  }

  function toggleQuestionPublic(qid) {
    updateTask({ ...task, questions: questions.map(q => q.id === qid ? { ...q, isPublic: !q.isPublic } : q) });
  }

  function withdraw() {
    if (!tx) return;
    addTransaction({ ...tx, status:'pago', paidAt: now() }, true);
    addNotification(user.id, `Saque de ${money(tx.net)} efetivado.`);
  }

  function submitReview() {
    if (myReview) return;
    const revieweeId = isOwner ? task.assigneeId : task.ownerId;
    if (!revieweeId) return;
    addReview({
      id: uid(), taskId: task.id, reviewerId: user.id, revieweeId,
      rating: reviewForm.rating, comment: reviewForm.comment, createdAt: now()
    });
    addNotification(revieweeId, `Você recebeu uma avaliação ${reviewForm.rating}★`);
    setReviewModal(false);
    setReviewForm({ rating:5, comment:'' });
  }

  return (
    <div className="max-w-4xl mx-auto fade-in">
      <button onClick={() => setView('tarefas')} className="text-sm text-slate-500 mb-3 hover:underline">← Voltar</button>
      <Card className="p-6 mb-4">
        <div className="flex items-start justify-between gap-3 mb-3 flex-wrap">
          <div>
            <div className="flex items-center gap-2 mb-1 flex-wrap">
              <Badge color={status.color}>{status.label}</Badge>
              <Badge color="bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300">{task.category}</Badge>
              {task.matchMode === 'race' && <Badge color="bg-amber-100 text-amber-700">⚡ Corrida</Badge>}
            </div>
            <h1 className="text-2xl font-bold">{task.title}</h1>
            <p className="text-slate-600 dark:text-slate-400 mt-1">{task.description}</p>
          </div>
          <div className="text-right">

              return (

          <div>

        <div className="flex gap-2 mt-5">

      <Modal open={revisionModal} onClose={() => setRevisionModal(false)} title="Solicitar revisão">

        <Textarea rows={4} value={revisionText} onChange={e => setRevisionText(e.target.value)} placeholder="Ex: A paleta de cores precisa ser mais sóbria, e o logo deve ter uma versão monocromática..."/>

          <div className="flex gap-1">
            {[1,2,3,4,5].map(i => (

                <svg viewBox="0 0 24 24" className="w-8 h-8" fill={i <= reviewForm.rating ? '#fbbf24' : 'none'} stroke="#fbbf24" strokeWidth="2">

        </div>
        <div className="mb-4">
          <p className="text-sm font-medium mb-1">Comentário</p>
          <Textarea rows={3} value={reviewForm.comment} onChange={e=>setReviewForm({...reviewForm, comment: e.target.value})} placeholder="Como foi a experiência?"/>
        </div>
        <Button className="w-full" onClick={submitReview} disabled={!reviewForm.comment.trim()}>Enviar avaliação</Button>
      </Modal>
    </div>
  );
}

// DIRETÓRIO
// ===================================================================
function Diretorio({ users, reviews, setView, defaultTab, defaultQ }) {
  const [tab, setTab] = useState(defaultTab || 'freelancer');
  useEffect(() => { if (defaultTab) setTab(defaultTab); }, [defaultTab]);
  const [q, setQ] = useState(defaultQ || '');
  useEffect(() => { if (defaultQ !== undefined) setQ(defaultQ); }, [defaultQ]);

  const filtered = users.filter(u => {
    if (!isUserPublic(u)) return false;
    if (tab === 'freelancer' && !(u.type === 'freelancer' || u.type === 'ambos')) return false;
    if (tab === 'empresa' && !(u.type === 'empresa' || u.type === 'ambos')) return false;
    const t = q.toLowerCase();
    if (!t) return true;
    return [u.handle, u.name, u.bio, ...(u.skills||[])].join(' ').toLowerCase().includes(t);
  });

  function avgRating(userId) {
    const rs = reviews.filter(r => r.revieweeId === userId);
    if (rs.length === 0) return null;
    return { avg: rs.reduce((s,r)=>s+r.rating,0)/rs.length, count: rs.length };
  }

  return (
    <div className="max-w-5xl mx-auto fade-in">
      <h1 className="text-2xl font-bold">Diretório</h1>
      <p className="text-slate-500 text-sm mb-4">Empresas e freelancers cadastrados na plataforma</p>

      <div className="relative mb-4">
        <Icon name="search" className="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"/>
        <Input value={q} onChange={e=>setQ(e.target.value)} placeholder="Buscar por nome, handle, habilidade..." className="pl-9"/>
      </div>

      <div className="flex gap-2 mb-4">
        {[
          { k:'empresa', l:'Empresas', i:'building' },
          { k:'freelancer', l:'Freelancers', i:'user' },
        ].map(t => (
          <button key={t.k} onClick={()=>setTab(t.k)}
            className={`px-3 py-1.5 rounded-full text-sm font-medium flex items-center gap-1.5 ${tab===t.k?'bg-brand-600 text-white':'bg-white border border-slate-200 dark:bg-slate-900 dark:border-slate-800'}`}>
            <Icon name={t.i} className="w-4 h-4"/>{t.l} ({users.filter(u => isUserPublic(u) && (t.k==='freelancer' ? (u.type==='freelancer'||u.type==='ambos') : (u.type==='empresa'||u.type==='ambos'))).length})
          </button>
        ))}
      </div>

      {filtered.length === 0 ? (
        <Card className="p-8"><Empty icon="users" title="Ninguém encontrado" desc="Tente outra busca."/></Card>
      ) : (
        <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-3">
          {filtered.map(u => {
            const r = avgRating(u.id);
            return (
              <Card key={u.id} className="p-4 hover:border-brand-300 transition cursor-pointer" onClick={() => setView({ view:'perfilPublico', userId: u.id })}>
                <div className="flex items-center gap-3 mb-2">
                  <Avatar user={u} size={48}/>
                  <div className="min-w-0">
                    <p className="font-semibold truncate">{u.name}</p>
                    <p className="text-xs text-slate-500">@{u.handle}</p>
                  </div>
                </div>
                {u.bio && <p className="text-xs text-slate-600 dark:text-slate-400 line-clamp-2 mb-2">{u.bio}</p>}
                <div className="flex items-center justify-between flex-wrap gap-1 text-xs">
                  {u.hourlyRate ? <span className="font-semibold text-brand-600">{money(u.hourlyRate)}/h</span> : <span className="text-slate-400">—</span>}
                  <RatingChip avg={r?.avg || 0} count={r?.count || 0}/>
                </div>
                {u.skills && u.skills.length > 0 && (
                  <div className="flex flex-wrap gap-1 mt-2">
                    {u.skills.slice(0,3).map(s => <Badge key={s} color="bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400">{s}</Badge>)}
                  </div>
                )}
              </Card>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ===================================================================
// FÓRUM
// ===================================================================
function Forum({ user, posts, setPosts, users, addNotification, setView }) {
  const [text, setText] = useState('');
  const [error, setError] = useState('');

  function publish() {
    setError('');
    const mod = moderate(text);
    if (!mod.ok) { setError(`Termos não permitidos detectados: ${mod.blocked.join(', ')}`); return; }
    if (text.trim().length < 3) { setError('Conteúdo muito curto.'); return; }
    const post = { id:uid(), authorId: user.id, content: text.trim(), likes:[], comments:[], reports:[], hidden:false, createdAt: now() };
    setPosts([post, ...posts]);
    setText('');
  }

  function toggleLike(p) {
    const liked = p.likes.includes(user.id);
    const upd = posts.map(x => x.id === p.id ? { ...x, likes: liked ? x.likes.filter(i => i !== user.id) : [...x.likes, user.id] } : x);
    setPosts(upd);
  }

  function report(p) {
    if (p.reports.includes(user.id)) return;
    const newReports = [...p.reports, user.id];
    const hidden = newReports.length >= REPORT_THRESHOLD;
    const upd = posts.map(x => x.id === p.id ? { ...x, reports: newReports, hidden } : x);
    setPosts(upd);
    if (hidden) addNotification(p.authorId, 'Seu post foi ocultado após múltiplas denúncias.');
  }

  function comment(p, txt) {
    if (!txt.trim()) return;
    const c = { id:uid(), authorId: user.id, content: txt.trim(), createdAt: now() };
    const upd = posts.map(x => x.id === p.id ? { ...x, comments: [...x.comments, c] } : x);
    setPosts(upd);
    if (p.authorId !== user.id) addNotification(p.authorId, `${user.name} comentou no seu post`);
  }

  return (
    <div className="max-w-2xl mx-auto fade-in">
      <h1 className="text-2xl font-bold mb-1">Fórum</h1>
      <p className="text-slate-500 text-sm mb-4">Conversas entre empresas e freelancers da plataforma</p>

      <Card className="p-4 mb-4">
        <div className="flex gap-3">
          <Avatar user={user} size={36}/>
          <div className="flex-1">
            <Textarea rows={2} value={text} onChange={e=>setText(e.target.value)} placeholder="Compartilhe algo sobre mercado de trabalho, dicas, vagas..."/>
            {error && <p className="text-rose-600 text-xs mt-1">{error}</p>}
            <div className="flex items-center justify-between mt-2">
              <p className="text-xs text-slate-500 flex items-center gap-1"><Icon name="shield" className="w-3 h-3"/> Moderação ativa</p>
              <Button size="sm" onClick={publish} disabled={!text.trim()}>Publicar</Button>
            </div>
          </div>
        </div>
      </Card>

      <div className="space-y-3">
        {posts.filter(p => !p.hidden || p.authorId === user.id).sort((a,b)=>b.createdAt-a.createdAt).map(p => (
          <PostCard key={p.id} post={p} user={user} users={users} onLike={() => toggleLike(p)} onReport={() => report(p)} onComment={(t) => comment(p, t)} setView={setView}/>
        ))}
      </div>
    </div>
  );
}

function PostCard({ post, user, users, onLike, onReport, onComment, setView }) {
  const author = users.find(u => u.id === post.authorId);
  const [showComments, setShowComments] = useState(false);
  const [c, setC] = useState('');
  const liked = post.likes.includes(user.id);
  const reported = post.reports.includes(user.id);
  const isHidden = post.hidden && post.authorId === user.id;
  const openProfile = (uid) => setView && setView({ view: 'perfilPublico', userId: uid });

  return (
    <Card className="p-4">
      {isHidden && (
        <div className="mb-3 p-2 rounded-lg bg-rose-50 text-rose-700 text-xs flex items-center gap-2">
          <Icon name="flag" className="w-4 h-4"/> Este post foi ocultado para outros usuários após múltiplas denúncias.
        </div>
      )}
      <button onClick={() => openProfile(post.authorId)} className="flex items-center gap-3 mb-3 hover:opacity-80 transition text-left">
        <Avatar user={author} size={36}/>
        <div>
          <p className="font-medium text-sm hover:underline">{author?.name} <span className="text-slate-400 font-normal">@{author?.handle}</span></p>
          <p className="text-xs text-slate-500">{ago(post.createdAt)}</p>
        </div>
      </button>
      <p className="text-sm whitespace-pre-wrap mb-3">{post.content}</p>
      <div className="flex items-center gap-1 pt-2 border-t border-slate-100 dark:border-slate-800">
        <button onClick={onLike} className={`flex items-center gap-1.5 px-2 py-1 rounded-md text-sm hover:bg-slate-100 dark:hover:bg-slate-800 ${liked?'text-brand-600':'text-slate-500'}`}>
          <Icon name="thumbsUp" className="w-4 h-4"/> {post.likes.length || 'Curtir'}
        </button>
        <button onClick={() => setShowComments(!showComments)} className="flex items-center gap-1.5 px-2 py-1 rounded-md text-sm text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800">
          <Icon name="msg" className="w-4 h-4"/> {post.comments.length || 'Comentar'}
        </button>
        <button onClick={onReport} disabled={reported} className={`flex items-center gap-1.5 px-2 py-1 rounded-md text-sm hover:bg-slate-100 dark:hover:bg-slate-800 ml-auto ${reported?'text-slate-300':'text-slate-500'}`}>
          <Icon name="flag" className="w-4 h-4"/> {reported?'Denunciado':'Denunciar'}
        </button>
      </div>
      {showComments && (
        <div className="mt-3 pt-3 border-t border-slate-100 dark:border-slate-800 space-y-2">
          {post.comments.map(cm => {
            const a = users.find(u => u.id === cm.authorId);
            return (
              <div key={cm.id} className="flex gap-2 text-sm">
                <button onClick={() => openProfile(cm.authorId)} className="shrink-0 hover:opacity-80">
                  <Avatar user={a} size={24}/>
                </button>
                <div className="flex-1 bg-slate-50 dark:bg-slate-800 rounded-lg p-2">
                  <p className="text-xs font-medium">
                    <button onClick={() => openProfile(cm.authorId)} className="hover:underline">@{a?.handle}</button>
                    <span className="text-slate-400 font-normal"> • {ago(cm.createdAt)}</span>
                  </p>
                  <p>{cm.content}</p>
                </div>
              </div>
            );
          })}
          <div className="flex gap-2">
            <Avatar user={user} size={24}/>
            <Input value={c} onChange={e=>setC(e.target.value)} placeholder="Escrever comentário..." onKeyDown={e=>{ if (e.key==='Enter' && c.trim()) { onComment(c); setC(''); } }}/>
          </div>
        </div>
      )}
    </Card>
  );
}

function Financeiro({ user, transactions, tasks, updateTx, addNotification }) {
  const out = transactions.filter(t => t.fromId === user.id);
  const inn = transactions.filter(t => t.toId === user.id);
  const totalOut = out.reduce((s,t) => s + t.gross, 0);
  const totalEarned = inn.filter(t => t.status === 'pago').reduce((s,t) => s + t.net, 0);
  const inEscrow = inn.filter(t => t.status === 'em_custodia').reduce((s,t) => s + t.net, 0);
  const available = inn.filter(t => t.status === 'liberado').reduce((s,t) => s + t.net, 0);

  function withdraw(tx) {
    updateTx({ ...tx, status:'pago', paidAt: now() });
    addNotification(user.id, `Saque de ${money(tx.net)} efetivado.`);
  }

  return (
    <div className="max-w-5xl mx-auto fade-in">
      <h1 className="text-2xl font-bold">Financeiro</h1>
      <p className="text-slate-500 text-sm mb-6">Pagamentos em escrow com 3 estados: custódia → liberado → pago</p>

      <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
        <StatCard icon="dollar" label="Total gasto" value={moneyShort(totalOut)} color="bg-rose-50 text-rose-700"/>
        <StatCard icon="clock" label="Em custódia (recebo)" value={moneyShort(inEscrow)} color="bg-amber-50 text-amber-700"/>
        <StatCard icon="zap" label="Disponível p/ saque" value={moneyShort(available)} color="bg-brand-50 text-brand-700"/>
        <StatCard icon="check" label="Total recebido" value={moneyShort(totalEarned)} color="bg-emerald-50 text-emerald-700"/>
      </div>

      {available > 0 && (
        <Card className="p-4 mb-4 bg-brand-50 dark:bg-brand-900/20 border-brand-200 dark:border-brand-800">
          <div className="flex items-center justify-between flex-wrap gap-2">
            <div>
              <p className="font-semibold text-brand-700 dark:text-brand-300">Você tem {money(available)} disponível para saque</p>
              <p className="text-xs text-slate-600 dark:text-slate-400">Em uma plataforma real, isso cairia na sua conta em 1-2 dias úteis.</p>
            </div>
            <Button onClick={() => inn.filter(t=>t.status==='liberado').forEach(withdraw)}>Sacar tudo</Button>
          </div>
        </Card>
      )}

      <Card className="p-4">
        <h2 className="font-semibold mb-3">Histórico de transações</h2>
        {transactions.length === 0 ? (
          <Empty icon="wallet" title="Sem transações ainda" desc="Quando você publicar ou aceitar uma tarefa, ela aparece aqui."/>
        ) : (
          <div className="space-y-2">
            {transactions.sort((a,b) => b.createdAt - a.createdAt).map(t => {
              const task = tasks.find(x => x.id === t.taskId);
              const isReceiver = t.toId === user.id;
              return (
                <div key={t.id} className="flex items-center justify-between p-3 rounded-lg border border-slate-200 dark:border-slate-800">
                  <div className="flex items-center gap-3 min-w-0 flex-1">
                    <div className={`w-9 h-9 rounded-lg flex items-center justify-center ${isReceiver?'bg-emerald-100 text-emerald-700':'bg-rose-100 text-rose-700'}`}>
                      <Icon name={isReceiver?'arrowRight':'dollar'}/>
                    </div>
                    <div className="min-w-0">
                      <p className="font-medium text-sm truncate">{task?.title || 'Tarefa'}</p>
                      <p className="text-xs text-slate-500">{new Date(t.createdAt).toLocaleDateString('pt-BR')}</p>
                    </div>
                  </div>
                  <div className="flex items-center gap-3">
                    <Badge color={TX_STATUS[t.status].color}>{TX_STATUS[t.status].label}</Badge>
                    <p className={`font-semibold ${isReceiver?'text-emerald-600':'text-rose-600'}`}>{isReceiver?'+':'-'}{money(isReceiver ? t.net : t.gross)}</p>
                    {isReceiver && t.status === 'liberado' && (
                      <Button size="sm" onClick={() => withdraw(t)}>Sacar</Button>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </Card>
    </div>
  );
}

function PerfilPublico({ userId, users, reviews, tasks, setView, currentUser, openConversationWith }) {
  const u = users.find(x => x.id === userId);
  if (!u) return <p>Usuário não encontrado.</p>;
  const userReviews = reviews.filter(r => r.revieweeId === u.id);
  const avg = userReviews.length ? userReviews.reduce((s,r)=>s+r.rating,0)/userReviews.length : 0;
  const [tab, setTab] = useState('info');

  return (
    <div className="max-w-3xl mx-auto fade-in">
      <button onClick={() => setView('diretorio')} className="text-sm text-slate-500 mb-3 hover:underline">← Voltar</button>
      <Card className="overflow-hidden">
        <div className="h-32 bg-gradient-to-r from-brand-400 to-brand-600 relative">
          {u.bannerUrl && <img src={u.bannerUrl} className="w-full h-full object-cover absolute inset-0" alt=""/>}
        </div>
        <div className="p-5">
          <div className="flex items-end justify-between mb-3 flex-wrap gap-2">
            <div className="relative -mt-16 shrink-0">
              <div className="rounded-full ring-4 ring-white dark:ring-slate-900">
                <Avatar user={u} size={88}/>
              </div>
            </div>
            <div className="flex gap-2">
              {avg > 0 && <Badge color="bg-amber-100 text-amber-700"><Icon name="star" className="w-3 h-3"/>{avg.toFixed(1)} ({userReviews.length})</Badge>}
            </div>
          </div>
          <h1 className="text-xl font-bold flex items-center gap-1.5">{u.name}{u.verified && <Icon name="badgeCheck" className="w-5 h-5 text-brand-500" title="Identidade verificada"/>}</h1>
          <p className="text-sm text-ink/55 dark:text-white/55">@{u.handle}</p>
          <div className="flex gap-1 mt-2">
            <Badge color="bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300">{u.type === 'empresa' ? '🏢 Empresa' : u.type === 'ambos' ? '⚡ Ambos' : '👤 Freelancer'}</Badge>
            {u.hourlyRate && <Badge color="bg-brand-100 text-brand-700">{money(u.hourlyRate)}/h</Badge>}
          </div>

          {currentUser && u.id !== currentUser.id && openConversationWith && (
            <Button className="mt-4 w-full" onClick={() => openConversationWith(u.id)}>
              <Icon name="mail" className="w-4 h-4"/>Enviar mensagem
            </Button>
          )}

          <div className="flex gap-2 mt-5 border-b border-slate-200 dark:border-slate-800">
            {['info','exp','reviews'].map(t => (
              <button key={t} onClick={() => setTab(t)}
                className={`px-3 py-2 text-sm font-medium border-b-2 ${tab===t?'border-brand-600 text-brand-700':'border-transparent text-slate-500'}`}>
                {t==='info'?'Informações':t==='exp'?'Experiências':`Avaliações (${userReviews.length})`}
              </button>
            ))}
          </div>

          <div className="mt-4">
            {tab === 'info' && (
              <div className="space-y-3">
                {u.bio && <p className="text-sm">{u.bio}</p>}
                {u.skills && u.skills.length > 0 && (
                  <div>
                    <p className="text-xs font-medium text-slate-500 mb-1">Habilidades</p>
                    <div className="flex flex-wrap gap-1">
                      {u.skills.map(s => <Badge key={s} color="bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300">{s}</Badge>)}
                    </div>
                  </div>
                )}
                <p className="text-xs text-slate-400 flex items-center gap-1 pt-2 border-t border-slate-100 dark:border-slate-800">
                  <Icon name="shield" className="w-3 h-3"/> E-mail privado — só compartilhado após match em uma tarefa
                </p>
              </div>
            )}
            {tab === 'exp' && (
              <div className="space-y-2">
                {(u.experiences || []).length === 0 && <p className="text-sm text-slate-500">Sem experiências cadastradas.</p>}
                {(u.experiences || []).map(e => (
                  <div key={e.id} className="p-3 rounded-lg bg-slate-50 dark:bg-slate-800">
                    <p className="font-medium text-sm">{e.role}</p>
                    <p className="text-sm text-slate-600 dark:text-slate-400">{e.company}</p>
                    <p className="text-xs text-slate-500">{e.start} – {e.end}</p>
                  </div>
                ))}
              </div>
            )}
            {tab === 'reviews' && (
              <div className="space-y-2">
                {userReviews.length === 0 && <p className="text-sm text-slate-500">Sem avaliações ainda.</p>}
                {userReviews.map(r => {
                  const reviewer = users.find(x => x.id === r.reviewerId);
                  const task = tasks.find(x => x.id === r.taskId);
                  return (
                    <div key={r.id} className="p-3 rounded-lg bg-slate-50 dark:bg-slate-800">
                      <div className="flex items-center gap-2 mb-1 flex-wrap">
                        <Stars rating={r.rating}/>
                        <span className="text-xs font-medium">@{reviewer?.handle}</span>
                        {task && <span className="text-xs text-slate-500">• tarefa: {task.title}</span>}
                      </div>
                      <p className="text-sm">{r.comment}</p>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        </div>
      </Card>
    </div>
  );
}

function PerfilEdit({ user, updateUser, setView }) {
  const [form, setForm] = useState(user);
  const [skill, setSkill] = useState('');
  const [exp, setExp] = useState({ role:'', company:'', start:'', end:'' });
  const [imgError, setImgError] = useState('');
  const [saving, setSaving] = useState(false);
  const toast = useToast();

  async function save() {
    setSaving(true);
    try {
      updateUser(form);
      await new Promise(r => setTimeout(r, 350));
      toast.success('Alterações salvas');
    } catch (e) {
      toast.error('Erro ao salvar. Tente novamente.');
    }
    setSaving(false);
  }

  async function onPickAvatar(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    setImgError('');
    try {
      const dataUrl = await readImageResized(file, 400, 400);
      setForm({ ...form, avatarUrl: dataUrl });
    } catch (err) { setImgError(err.message); }
    e.target.value = '';
  }
  async function onPickBanner(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    setImgError('');
    try {
      const dataUrl = await readImageResized(file, 1400, 400);
      setForm({ ...form, bannerUrl: dataUrl });
    } catch (err) { setImgError(err.message); }
    e.target.value = '';
  }
  function removeAvatar() { setForm({ ...form, avatarUrl: null }); }
  function removeBanner() { setForm({ ...form, bannerUrl: null }); }
  function addSkill() {
    if (!skill.trim()) return;
    setForm({ ...form, skills: [...(form.skills||[]), skill.trim()] });
    setSkill('');
  }
  function removeSkill(s) { setForm({ ...form, skills: form.skills.filter(x => x !== s) }); }
  function addExp() {
    if (!exp.role || !exp.company) return;
    setForm({ ...form, experiences: [...(form.experiences||[]), { id: uid(), ...exp }] });
    setExp({ role:'', company:'', start:'', end:'' });
  }
  function removeExp(id) { setForm({ ...form, experiences: form.experiences.filter(x => x.id !== id) }); }

  return (
    <div className="max-w-3xl mx-auto fade-in">
      {setView && <button onClick={() => setView('perfil')} className="text-sm text-slate-500 mb-3 hover:underline">← Voltar para perfil</button>}
      <h1 className="text-2xl font-bold mb-1">Configurações</h1>
      <p className="text-slate-500 text-sm mb-6">Edite seu perfil público</p>

      <Card className="overflow-hidden mb-4">
        <div className="relative h-32 bg-gradient-to-r from-brand-400 to-brand-600">
          {form.bannerUrl && <img src={form.bannerUrl} className="w-full h-full object-cover absolute inset-0" alt=""/>}
          <div className="absolute top-3 right-3 flex gap-2">
            <label className="inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg bg-black/50 hover:bg-black/70 text-white text-xs cursor-pointer backdrop-blur-sm">
              <input type="file" accept="image/*" className="hidden" onChange={onPickBanner}/>
              <Icon name="image" className="w-3.5 h-3.5"/> {form.bannerUrl ? 'Trocar banner' : 'Adicionar banner'}
            </label>
            {form.bannerUrl && (
              <button onClick={removeBanner} className="inline-flex items-center px-2 py-1.5 rounded-lg bg-black/50 hover:bg-rose-600 text-white text-xs">
                <Icon name="trash" className="w-3.5 h-3.5"/>
              </button>
            )}
          </div>
        </div>
        <div className="p-5 space-y-4">
          <div className="flex items-end gap-4">
            <div className="relative -mt-16 shrink-0">
              <div className="rounded-full ring-4 ring-white dark:ring-slate-900">
                <Avatar user={form} size={88}/>
              </div>
              <label className="absolute bottom-1 right-1 w-8 h-8 rounded-full bg-brand-600 hover:bg-brand-700 text-white flex items-center justify-center cursor-pointer shadow-md ring-2 ring-white dark:ring-slate-900">
                <input type="file" accept="image/*" className="hidden" onChange={onPickAvatar}/>
                <Icon name="pencil" className="w-3.5 h-3.5"/>
              </label>
            </div>
            <div className="flex-1 min-w-0">
              <p className="text-sm font-medium">@{form.handle}</p>
              <p className="text-xs text-slate-500">Handle não pode ser alterado</p>
              {form.avatarUrl && (
                <button onClick={removeAvatar} className="text-xs text-rose-600 hover:underline mt-1">Remover foto</button>
              )}
            </div>
          </div>
          {imgError && <p className="text-rose-600 text-xs">⚠ {imgError}</p>}
        <div>
          <label className="text-sm font-medium">Tipo de conta</label>
          <div className="grid grid-cols-3 gap-2 mt-1">
            {[
              {v:'empresa', l:'Empresa'},
              {v:'freelancer', l:'Freelancer'},
              {v:'ambos', l:'Ambos'},
            ].map(o => (
              <button key={o.v} onClick={()=>setForm({...form, type: o.v})}
                className={`p-2 rounded-lg border text-sm ${form.type===o.v?'border-brand-600 bg-brand-50 dark:bg-brand-900/20':'border-slate-200 dark:border-slate-700'}`}>
                {o.l}
              </button>
            ))}
          </div>
        </div>
        <div>
          <label className="text-sm font-medium">Nome / Empresa</label>
          <Input value={form.name} onChange={e=>setForm({...form, name: e.target.value})}/>
        </div>
        <div>
          <label className="text-sm font-medium">Bio</label>
          <Textarea rows={3} value={form.bio || ''} onChange={e=>setForm({...form, bio: e.target.value})}/>
        </div>
        {form.type !== 'empresa' && (
          <div>
            <label className="text-sm font-medium">Valor/hora (R$)</label>
            <Input type="number" value={form.hourlyRate || ''} onChange={e=>setForm({...form, hourlyRate: Number(e.target.value)})}/>
          </div>
        )}
        <div>
          <label className="text-sm font-medium">Habilidades</label>
          <div className="flex gap-2 mt-1">
            <Input value={skill} onChange={e=>setSkill(e.target.value)} placeholder="Ex.: React" onKeyDown={e=>e.key==='Enter'&&addSkill()}/>
            <Button variant="secondary" onClick={addSkill}>Add</Button>
          </div>
          <div className="flex flex-wrap gap-1 mt-2">
            {(form.skills || []).map(s => (
              <button key={s} onClick={() => removeSkill(s)} className="inline-flex items-center gap-1 text-xs px-2 py-1 rounded-full bg-slate-100 dark:bg-slate-800 dark:text-slate-200 hover:bg-rose-100 hover:text-rose-700 dark:hover:bg-rose-900/30 dark:hover:text-rose-300">
                {s} <Icon name="x" className="w-3 h-3"/>
              </button>
            ))}
          </div>
        </div>
        <Button onClick={save} loading={saving}>{!saving && <Icon name="check" className="w-4 h-4"/>}{saving ? 'Salvando...' : 'Salvar alterações'}</Button>
        </div>
      </Card>

      <Card className="p-5">
        <h3 className="font-semibold mb-3">Experiências profissionais</h3>
        <div className="space-y-2 mb-3">
          {(form.experiences || []).map(e => (
            <div key={e.id} className="flex items-center justify-between p-2 rounded-lg bg-slate-50 dark:bg-slate-800">
              <div className="text-sm">
                <p className="font-medium">{e.role}</p>
                <p className="text-xs text-slate-500">{e.company} • {e.start} - {e.end}</p>
              </div>
              <button onClick={() => removeExp(e.id)} className="text-rose-500 p-1 hover:bg-rose-50 rounded">
                <Icon name="trash" className="w-4 h-4"/>
              </button>
            </div>
          ))}
        </div>
        <div className="grid grid-cols-2 gap-2 text-sm">
          <Input placeholder="Cargo" value={exp.role} onChange={e=>setExp({...exp, role: e.target.value})}/>
          <Input placeholder="Empresa" value={exp.company} onChange={e=>setExp({...exp, company: e.target.value})}/>
          <Input placeholder="Início (ex: 2022)" value={exp.start} onChange={e=>setExp({...exp, start: e.target.value})}/>
          <Input placeholder="Fim (ex: Atual)" value={exp.end} onChange={e=>setExp({...exp, end: e.target.value})}/>
        </div>
        <Button variant="secondary" className="mt-2" onClick={addExp}><Icon name="plus" className="w-4 h-4"/>Adicionar experiência</Button>
      </Card>

      <Card className="p-5 mt-4">
        <div className="flex items-start gap-3 mb-3">
          <div className="w-10 h-10 rounded-2xl bg-brand-50 dark:bg-brand-500/15 text-brand-600 flex items-center justify-center shrink-0">
            <Icon name="badgeCheck" className="w-5 h-5"/>
          </div>
          <div className="flex-1">
            <h3 className="font-semibold flex items-center gap-1.5">Verificação de identidade
              {form.verified && <span className="text-[10px] font-bold px-1.5 py-0.5 rounded bg-brand-100 dark:bg-brand-500/20 text-brand-700 dark:text-brand-300">VERIFICADO</span>}
            </h3>
            <p className="text-xs text-ink/55 dark:text-white/55 mt-0.5">Aumenta sua credibilidade e dá selo verde no seu perfil.</p>
          </div>
        </div>
        {form.verified ? (
          <div className="p-3 rounded-2xl bg-brand-50/60 dark:bg-brand-500/10 border border-brand-200 dark:border-brand-500/30">
            <p className="text-sm font-medium text-brand-700 dark:text-brand-300">✓ {form.docType?.toUpperCase()} verificado</p>
            <p className="text-[11px] text-ink/55 dark:text-white/55 mt-1">Documento: {form.docNumber}</p>
          </div>
        ) : (
          <div className="space-y-2">
            <div className="flex gap-2">
              {[{v:'cpf',l:'CPF'},{v:'cnpj',l:'CNPJ'}].map(o => (
                <button key={o.v} onClick={() => setForm({...form, docType: o.v})}
                  className={`tappable flex-1 p-2 rounded-xl border text-sm font-medium ${form.docType===o.v?'border-brand-500 bg-brand-50 dark:bg-brand-500/15 text-brand-700 dark:text-brand-300':'border-black/10 dark:border-white/15'}`}>{o.l}</button>
              ))}
            </div>
            <Input value={form.docNumber || ''} onChange={e => setForm({...form, docNumber: e.target.value})}
              placeholder={form.docType === 'cnpj' ? '00.000.000/0000-00' : '000.000.000-00'}/>
            <Button variant="outline" className="w-full" onClick={() => {
              const d = (form.docNumber || '').replace(/\D/g, '');
              const ok = (form.docType === 'cnpj' && d.length === 14) || (form.docType === 'cpf' && d.length === 11) || (!form.docType && d.length >= 11);
              if (!ok) { toast.error('Documento inválido'); return; }
              const updated = { ...form, verified: true, docType: form.docType || 'cpf', verifiedAt: now() };
              setForm(updated);
              updateUser(updated);
              toast.success('Identidade verificada!');
            }}><Icon name="badgeCheck" className="w-4 h-4"/>Verificar agora</Button>
            <p className="text-[10px] text-ink/45 dark:text-white/45 text-center">Em produção, integraríamos a BrasilAPI / Receita Federal para checar o documento.</p>
          </div>
        )}
      </Card>

      <div className="mt-6 p-4 rounded-xl bg-rose-50 border border-rose-200 dark:bg-rose-900/10 dark:border-rose-900/30">
        <p className="font-semibold text-rose-700 dark:text-rose-300 text-sm">Zona de perigo</p>
        <p className="text-xs text-slate-600 dark:text-slate-400 mb-2">Resetar dados de demonstração (apaga tudo do localStorage).</p>
        <Button variant="danger" size="sm" onClick={() => { if (confirm('Apagar todos os dados locais e voltar à seed inicial?')) { localStorage.clear(); location.reload(); }}}>
          Resetar app
        </Button>
      </div>
    </div>
  );
}

function ChatView({ user, conversationId, conversations, setConversations, users, setView, addNotification }) {
  const conv = conversations.find(c => c.id === conversationId);
  const otherId = conv?.participants.find(p => p !== user.id);
  const other = users.find(u => u.id === otherId);
  const [text, setText] = useState('');
  const [attaching, setAttaching] = useState(false);
  const [reportOpen, setReportOpen] = useState(false);
  const [imgViewer, setImgViewer] = useState(null);
  const [menuMsgId, setMenuMsgId] = useState(null);
  const scrollRef = useRef(null);
  const fileRef = useRef(null);
  const menuRef = useRef(null);
  const toast = useToast();

  useEffect(() => {
    if (!menuMsgId) return;
    function close(e) { if (menuRef.current && !menuRef.current.contains(e.target)) setMenuMsgId(null); }
    document.addEventListener('mousedown', close);
    document.addEventListener('touchstart', close);
    return () => {
      document.removeEventListener('mousedown', close);
      document.removeEventListener('touchstart', close);
    };
  }, [menuMsgId]);

  async function deleteMessage(msgId) {
    const updated = {
      ...conv,
      messages: conv.messages.map(m => m.id === msgId ? { ...m, deleted: true, text: '', attachment: null, deletedAt: now() } : m)
    };
    const lastVisible = [...updated.messages].reverse().find(m => !m.deleted);
    if (lastVisible) {
      updated.lastMessage = lastVisible.attachment ? `📎 ${lastVisible.attachment.name}` : lastVisible.text;
    } else {
      updated.lastMessage = 'Mensagem apagada';
    }
    setConversations(conversations.map(c => c.id === conv.id ? updated : c));
    setMenuMsgId(null);
    toast.success('Mensagem apagada');
    try { await fetch(`/api/messages/${msgId}`, { method:'DELETE', credentials:'include' }); }
    catch (e) { console.error('delete msg failed', e); }
  }

  useEffect(() => {
    if (!conv) return;
    if (conv.messages.some(m => !m.read && m.fromId !== user.id)) {
      const updated = { ...conv, messages: conv.messages.map(m => m.fromId !== user.id ? { ...m, read:true } : m) };
      setConversations(conversations.map(c => c.id === conv.id ? updated : c));
      fetch('/api/messages', {
        method:'PATCH', credentials:'include',
        headers:{'content-type':'application/json'},
        body: JSON.stringify({ conversationId: conv.id }),
      }).catch(e => console.error('mark read failed', e));
    }
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [conv?.id, conv?.messages.length]);

  if (!conv) return (
    <div className="text-center py-12">
      <p>Conversa não encontrada.</p>
      <Button variant="secondary" onClick={() => setView('mensagens')} className="mt-3">← Voltar</Button>
    </div>
  );

  async function send(extra = {}) {
    const t = text.trim();
    if (!t && !extra.attachment) return;
    const mod = moderate(t);
    if (!mod.ok) { toast.error('Termos não permitidos: ' + mod.blocked.join(', ')); return; }
    const tmpId = uid();
    const newMsg = { id: tmpId, fromId: user.id, text: t, createdAt: now(), read: false, ...extra };
    const lastMsg = extra.attachment ? `📎 ${extra.attachment.name}` : t;
    const updated = { ...conv, messages: [...conv.messages, newMsg], lastMessage: lastMsg, lastAt: newMsg.createdAt };
    setConversations(conversations.map(c => c.id === conv.id ? updated : c));
    addNotification(otherId, `${user.name} te mandou uma mensagem`);
    setText('');
    try {
      const res = await fetch('/api/messages', {
        method:'POST', credentials:'include',
        headers:{'content-type':'application/json'},
        body: JSON.stringify({ conversationId: conv.id, text: t, attachment: extra.attachment }),
      });
      if (res.ok) {
        const data = await res.json();
        setConversations(prev => prev.map(c => c.id === conv.id
          ? { ...c, messages: c.messages.map(m => m.id === tmpId ? { ...m, id: data.id } : m) }
          : c));
      }
    } catch (e) { console.error('send message failed', e); }
  }

  async function onPickFile(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    setAttaching(true);
    try {
      const result = await readFileAsDataURL(file, 5);
      send({ attachment: result });
      toast.success('Arquivo enviado');
    } catch (err) { toast.error(err.message); }
    setAttaching(false);
    e.target.value = '';
  }

  function reportConversation() {
    setReportOpen(false);
    toast.success('Denúncia recebida. Nossa equipe vai revisar.');
    addNotification(user.id, `Denúncia registrada para a conversa com @${other?.handle}`);
  }

  return (
    <div className="max-w-2xl mx-auto fade-in flex flex-col" style={{minHeight: 'calc(100vh - 200px)'}}>
      <button onClick={() => setView('mensagens')} className="tappable text-sm text-ink/60 dark:text-white/60 font-medium mb-3">← Voltar para mensagens</button>
      <Card className="p-3 mb-3 flex items-center gap-3">
        <button onClick={() => setView({ view:'perfilPublico', userId: otherId })} className="tappable"><Avatar user={other} size={40}/></button>
        <button onClick={() => setView({ view:'perfilPublico', userId: otherId })} className="tappable text-left flex-1">
          <p className="font-semibold text-sm flex items-center gap-1.5">{other?.name}{other?.verified && <Icon name="badgeCheck" className="w-4 h-4 text-brand-500"/>}</p>
          <p className="text-xs text-ink/55 dark:text-white/55">@{other?.handle}</p>
        </button>
        <button onClick={() => setReportOpen(true)} className="tappable w-9 h-9 flex items-center justify-center rounded-full hover:bg-rose-50 dark:hover:bg-rose-500/10 text-ink/50 hover:text-rose-600">
          <Icon name="flag" className="w-4 h-4"/>
        </button>
      </Card>
      <Card className="flex-1 p-4 overflow-y-auto scrollbar space-y-2 mb-3" ref={scrollRef} style={{maxHeight: '60vh'}}>
        {conv.messages.length === 0 && <p className="text-center text-sm text-ink/50 dark:text-white/50 py-8">Comece a conversa enviando uma mensagem.</p>}
        {conv.messages.map(m => {
          const mine = m.fromId === user.id;
          const att = m.attachment;
          const isImage = att && att.mime?.startsWith('image/');

          // Soft-deleted: render tombstone
          if (m.deleted) {
            return (
              <div key={m.id} className={`flex ${mine?'justify-end':''}`}>
                <div className={`max-w-[80%] px-3.5 py-2 rounded-2xl ${mine?'bg-brand-500/30 text-white/80 rounded-br-md':'bg-black/[0.04] dark:bg-white/[0.06] text-ink/50 dark:text-white/50 rounded-bl-md'} flex items-center gap-2`}>
                  <Icon name="trash" className="w-3.5 h-3.5 opacity-70"/>
                  <p className="text-sm italic">Mensagem apagada</p>
                  <span className="text-[10px] opacity-60 ml-1">{ago(m.deletedAt || m.createdAt)}</span>
                </div>
              </div>
            );
          }

          return (
            <div key={m.id} className={`flex ${mine?'justify-end':''} group relative`}>
              <div className={`max-w-[80%] rounded-2xl relative ${mine?'bg-brand-500 text-white rounded-br-md shadow-[0_2px_8px_rgba(16,183,127,0.25)]':'bg-white dark:bg-white/10 rounded-bl-md border border-black/[0.06] dark:border-white/10'} ${att?'p-1.5':'px-3.5 py-2'}`}>
                {isImage && (
                  <button onClick={() => setImgViewer(att.dataUrl)} className="block">
                    <img src={att.dataUrl} className="rounded-xl max-w-full max-h-80 object-cover" alt={att.name}/>
                  </button>
                )}
                {att && !isImage && (
                  <a href={att.dataUrl} download={att.name}
                    className={`flex items-center gap-2.5 px-2.5 py-2 rounded-xl ${mine?'bg-white/15':'bg-black/[0.04] dark:bg-white/10'}`}>
                    <div className={`w-9 h-9 rounded-lg flex items-center justify-center ${mine?'bg-white/20':'bg-brand-50 dark:bg-brand-500/15 text-brand-600'}`}>
                      <Icon name="file" className="w-4 h-4"/>
                    </div>
                    <div className="min-w-0 flex-1">
                      <p className={`text-sm font-medium truncate ${mine?'':'text-ink dark:text-white'}`}>{att.name}</p>
                      <p className={`text-[11px] ${mine?'opacity-80':'text-ink/50 dark:text-white/50'}`}>{fmtBytes(att.size)}</p>
                    </div>
                    <Icon name="download" className={`w-4 h-4 ${mine?'opacity-80':'text-ink/50 dark:text-white/50'}`}/>
                  </a>
                )}
                {m.text && <p className={`text-sm whitespace-pre-wrap break-words ${att?'mt-1.5 px-2':''}`}>{m.text}</p>}
                <p className={`text-[10px] ${att?'px-2 pb-1':'mt-1'} ${mine?'text-white/70':'text-ink/45 dark:text-white/45'}`}>{ago(m.createdAt)}</p>
              </div>

              {mine && (
                <div className="relative" ref={menuMsgId === m.id ? menuRef : null}>
                  <button
                    title="Mais opções"
                    onClick={() => setMenuMsgId(menuMsgId === m.id ? null : m.id)}
                    className={`tappable self-center mx-1 w-7 h-7 rounded-full flex items-center justify-center text-ink/40 dark:text-white/40 hover:bg-black/[0.05] dark:hover:bg-white/10 transition ${menuMsgId === m.id ? 'opacity-100 bg-black/[0.05] dark:bg-white/10' : 'opacity-0 group-hover:opacity-100 md:focus:opacity-100'} max-md:opacity-100`}
                  >
                    <Icon name="moreVertical" className="w-4 h-4"/>
                  </button>
                  {menuMsgId === m.id && (
                    <div className="absolute right-0 top-8 z-20 glass-strong border border-black/5 dark:border-white/10 rounded-2xl shadow-ios-lg overflow-hidden scale-in min-w-[160px]">
                      <button
                        onClick={() => deleteMessage(m.id)}
                        className="tappable w-full px-4 py-3 text-left text-sm font-medium text-rose-600 hover:bg-rose-50 dark:hover:bg-rose-500/10 flex items-center gap-2.5"
                      >
                        <Icon name="trash" className="w-4 h-4"/>Apagar mensagem
                      </button>
                    </div>
                  )}
                </div>
              )}
            </div>
          );
        })}
      </Card>
      <div className="flex gap-2 items-center">
        <input ref={fileRef} type="file" className="hidden" onChange={onPickFile}
          accept="image/*,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/zip,.txt"/>
        <div className="relative group/clip shrink-0">
          <button onClick={() => fileRef.current?.click()} disabled={attaching}
            title="Anexar arquivo" aria-label="Anexar arquivo"
            className="tappable w-11 h-11 flex items-center justify-center rounded-2xl bg-black/[0.04] dark:bg-white/[0.06] hover:bg-brand-50 dark:hover:bg-brand-500/10 text-ink/60 dark:text-white/60 hover:text-brand-600 transition disabled:opacity-50">
            {attaching ? <Spinner/> : <Icon name="paperclip" className="w-5 h-5"/>}
          </button>
          <span className="pointer-events-none absolute left-1/2 -translate-x-1/2 -top-9 px-2.5 py-1 rounded-lg bg-ink dark:bg-white text-white dark:text-ink text-xs font-medium whitespace-nowrap opacity-0 group-hover/clip:opacity-100 transition-opacity shadow-ios">
            Anexar arquivo
            <span className="absolute left-1/2 -translate-x-1/2 -bottom-1 w-2 h-2 bg-ink dark:bg-white rotate-45"/>
          </span>
        </div>
        <Input value={text} onChange={e=>setText(e.target.value)} placeholder="Escreva uma mensagem..." onKeyDown={e=>{ if (e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); }}}/>
        <Button onClick={() => send()} disabled={!text.trim()}><Icon name="arrowRight" className="w-4 h-4"/></Button>
      </div>

      {imgViewer && (
        <div onClick={() => setImgViewer(null)} className="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4 fade-in cursor-pointer">
          <img src={imgViewer} className="max-w-full max-h-full rounded-2xl"/>
        </div>
      )}

      <Modal open={reportOpen} onClose={() => setReportOpen(false)} title="Denunciar conversa">
        <p className="text-sm text-ink/70 dark:text-white/70 mb-4">Confirma que essa conversa viola as regras da plataforma (golpe, abuso, contato fora do app)?</p>
        <div className="flex gap-2">
          <Button variant="secondary" className="flex-1" onClick={() => setReportOpen(false)}>Cancelar</Button>
          <Button variant="danger" className="flex-1" onClick={reportConversation}>Denunciar</Button>
        </div>
      </Modal>
    </div>
  );
}

function Inicio({ user, tasks, users, conversations, reviews, setView }) {
  const isEmpresa = user.type === 'empresa' || user.type === 'ambos';
  const isFreela = user.type === 'freelancer' || user.type === 'ambos';
  const [query, setQuery] = useState('');
  const [category, setCategory] = useState(null); // chip key or null
  const q = query.trim().toLowerCase();
  const searching = q.length > 0;
  const filteringByCat = !!category;
  const filtering = searching || filteringByCat;

  const matchUser = (u) => {
    if (!searching) return true;
    const hay = [u.name, u.handle, u.bio, ...(u.skills||[]), u.companyName].filter(Boolean).join(' ').toLowerCase();
    return hay.includes(q);
  };
  const matchTask = (t) => {
    if (!searching) return true;
    const hay = [t.title, t.description, t.category].filter(Boolean).join(' ').toLowerCase();
    return hay.includes(q);
  };

  const myOngoing = tasks
    .filter(t => (t.ownerId === user.id || t.assigneeId === user.id) && !['concluida','cancelada','rascunho'].includes(t.status))
    .sort((a,b) => b.createdAt - a.createdAt);

  const recOpenTasks = tasks
    .filter(t => t.status === 'aberta' && t.ownerId !== user.id)
    .filter(matchTask)
    .sort((a,b) => b.createdAt - a.createdAt)
    .slice(0, searching ? 6 : 3);

  const recFreelancers = users
    .filter(u => u.id !== user.id && isUserPublic(u) && (u.type === 'freelancer' || u.type === 'ambos'))
    .filter(matchUser)
    .filter(u => matchesCategory(u, category))
    .slice(0, filtering ? 10 : 3);

  const recEmpresas = users
    .filter(u => u.id !== user.id && isUserPublic(u) && (u.type === 'empresa' || u.type === 'ambos'))
    .filter(matchUser)
    .slice(0, searching ? 10 : 3);

  const recentMsgs = conversations
    .filter(c => c.participants.includes(user.id) && c.messages.length > 0)
    .sort((a,b) => b.lastAt - a.lastAt)
    .slice(0, 2);

  const totalResults = searching ? (recFreelancers.length + recEmpresas.length + recOpenTasks.length) : 0;

  const firstName = (user.name || user.handle).split(' ')[0];

  return (
    <div className="max-w-2xl mx-auto fade-in">
      <div className="mb-5">
        <p className="text-sm text-ink/65 dark:text-white/65 font-medium">{new Date().toLocaleDateString('pt-BR',{weekday:'long', day:'numeric', month:'long'})}</p>
        <h1 className="text-[34px] font-bold tracking-tight leading-tight">Olá, {firstName}</h1>
      </div>

      <div className="mb-6 relative">

          type="search" value={query} onChange={e => setQuery(e.target.value)}

          className="w-full pl-12 pr-12 py-3.5 rounded-2xl bg-white dark:bg-white/10 border border-black/[0.06] dark:border-white/10 shadow-ios focus:outline-none focus:border-brand-500 focus:shadow-[0_4px_18px_rgba(16,183,127,0.18)] text-[15px] placeholder:text-ink/40 dark:placeholder:text-white/40 transition"
        />
        {query && (
          <button onClick={() => setQuery('')}

            <Icon name="x" className="w-3.5 h-3.5"/>
