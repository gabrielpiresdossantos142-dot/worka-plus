// === BACKEND BOOTSTRAP ===================================================
// Carrega /api/bootstrap (server: users, tasks, conversations, etc) e popula
// o cache de memória ANTES do App renderizar. Login/signup chamam APIs.
// =========================================================================
async function bootstrapApp() {
  try {
    const r = await fetch('/api/bootstrap', { credentials: 'include' });
    if (!r.ok) throw new Error('bootstrap failed: ' + r.status);
    const data = await r.json();
    storage._seed({
      users: data.users || [],
      tasks: data.tasks || [],
      reviews: data.reviews || [],
      transactions: data.transactions || [],
      notifications: data.notifications || [],
      conversations: data.conversations || [],
      currentUserId: data.currentUserId,
    });
  } catch (e) {
    console.error('Bootstrap falhou:', e);
    // Mesmo sem servidor, deixa o cache vazio e segue. O Login vai aparecer.
  }
}

// Mensagens que mudam durante o carregamento — sensação de progresso real
const LOADING_MSGS = [
  { at: 0,    text: 'Carregando' },
  { at: 2000, text: 'Conectando ao servidor' },
  { at: 5000, text: 'Quase lá' },
  { at: 9000, text: 'Servidor acordando, só mais um instante' },
];

function BootGate() {
  const [ready, setReady] = useState(false);
  const [msgIdx, setMsgIdx] = useState(0);

  useEffect(() => { bootstrapApp().then(() => setReady(true)); }, []);

  useEffect(() => {
    if (ready) return;
    const timers = LOADING_MSGS.map((m, i) => setTimeout(() => setMsgIdx(i), m.at));
    return () => timers.forEach(clearTimeout);
  }, [ready]);

  if (!ready) {
    return (
      <div className="min-h-screen flex items-center justify-center bg-mist dark:bg-black">
        <div className="flex flex-col items-center gap-5">
          {/* Logo W pulsando */}
          <div className="relative">
            <div className="w-16 h-16 rounded-2xl bg-brand-500 flex items-center justify-center text-white text-3xl font-bold shadow-[0_8px_24px_rgba(16,183,127,0.4)] animate-pulse"
                 style={{ animationDuration: '1.4s' }}>
              w
            </div>
            <div className="absolute inset-0 rounded-2xl bg-brand-500/30 animate-ping" style={{ animationDuration: '1.8s' }}/>
          </div>

          {/* 3 bolinhas saltando */}
          <div className="flex gap-1.5">
            {[0, 1, 2].map(i => (
              <div key={i}
                   className="w-2 h-2 rounded-full bg-brand-500 animate-bounce"
                   style={{ animationDelay: `${i * 0.15}s`, animationDuration: '0.9s' }}/>
            ))}
          </div>

          {/* Texto que muda */}
          <div className="text-sm text-ink/55 dark:text-white/55 font-medium fade-in" key={msgIdx}>
            {LOADING_MSGS[msgIdx].text}…
          </div>
        </div>
      </div>
    );
  }
  return <App />;
}

function App() {
  const [currentUserId, setCurrentUserId] = useStorageState('currentUserId', null);
  const [users, setUsers] = useStorageState('users', []);
  const [tasks, setTasks] = useStorageState('tasks', []);
  const [reviews, setReviews] = useStorageState('reviews', []);
  const [transactions, setTransactions] = useStorageState('transactions', []);
  const [posts, setPosts] = useStorageState('posts', []);
  const [notifications, setNotifications] = useStorageState('notifications', []);
  const [conversations, setConversations] = useStorageState('conversations', []);
  const [dark, setDark] = useStorageState('dark', false);
  const [route, setRoute] = useState({ view: 'inicio' });

  useEffect(() => {
    document.documentElement.classList.toggle('dark', dark);
  }, [dark]);

  const view = typeof route === 'string' ? route : route.view;
  const setView = (r) => setRoute(typeof r === 'string' ? { view: r } : r);

  if (!currentUserId || !users.find(u => u.id === currentUserId)) {
    return <Login users={users} createUser={(u) => setUsers([...users, u])} onLogin={(id) => setCurrentUserId(id)} />;
  }
  const user = users.find(u => u.id === currentUserId);
  const onboardingKey = `wp_onboarded_${user.id}`;
  const [showOnboarding, setShowOnboarding] = useState(() => !localStorage.getItem(onboardingKey));

  // ===== BACKEND HELPERS ================================================
  // Estratégia: atualização OTIMISTA — muda o state local imediatamente,
  // depois sincroniza com /api/* em background. Se a API falhar, mostra erro
  // (e ainda assim mantém o state local — usuário não perde nada).
  // =====================================================================
  const apiPost = (path, body) => fetch(path, {
    method:'POST', credentials:'include',
    headers:{'content-type':'application/json'},
    body: JSON.stringify(body),
  }).then(r => r.ok ? r.json() : r.json().then(e => Promise.reject(e)));

  const apiPatch = (path, body) => fetch(path, {
    method:'PATCH', credentials:'include',
    headers:{'content-type':'application/json'},
    body: JSON.stringify(body),
  }).then(r => r.ok ? r.json() : r.json().then(e => Promise.reject(e)));

  const apiDelete = (path) => fetch(path, { method:'DELETE', credentials:'include' })
    .then(r => r.ok ? r.json() : r.json().then(e => Promise.reject(e)));

  async function addTask(t) {
    setTasks([t, ...tasks]); // otimista
    try {
      const res = await apiPost('/api/tasks', {
        title: t.title, description: t.description, category: t.category,
        matchMode: t.matchMode, complexity: t.complexity,
        estimatedHours: t.estimatedHours,
        suggestedPrice: t.suggestedPrice, finalPrice: t.finalPrice,
        briefing: t.briefing, checklist: t.checklist, maxRevisions: t.maxRevisions,
      });
      // Substitui o ID temporário pelo real do servidor
      setTasks(prev => prev.map(x => x.id === t.id ? { ...x, id: res.id } : x));
    } catch (e) { console.error('addTask failed', e); }
  }

  async function updateTask(t) {
    setTasks(tasks.map(x => x.id === t.id ? t : x));
    try {
      await apiPatch(`/api/tasks/${t.id}`, {
        status: t.status, assigneeId: t.assigneeId, finalPrice: t.finalPrice,
        completedAt: t.completedAt, checklist: t.checklist,
        deliveries: t.deliveries, questions: t.questions,
      });
    } catch (e) { console.error('updateTask failed', e); }
  }

  async function addReview(r) {
    setReviews([r, ...reviews]);
    try {
      const res = await apiPost('/api/reviews', {
        taskId: r.taskId, revieweeId: r.revieweeId,
        rating: r.rating, comment: r.comment,
      });
      setReviews(prev => prev.map(x => x.id === r.id ? { ...x, id: res.id } : x));
    } catch (e) { console.error('addReview failed', e); }
  }

  async function addTransaction(t, upsert = false) {
    if (upsert) {
      setTransactions(transactions.map(x => x.id === t.id ? t : x));
      try {
        await apiPatch(`/api/transactions/${t.id}`, {
          status: t.status, releasedAt: t.releasedAt, paidAt: t.paidAt,
        });
      } catch (e) { console.error('updateTx (upsert) failed', e); }
    } else {
      setTransactions([t, ...transactions]);
      try {
        const res = await apiPost('/api/transactions', {
          taskId: t.taskId, fromId: t.fromId, toId: t.toId,
          gross: t.gross, fee: t.fee, net: t.net, status: t.status,
        });
        setTransactions(prev => prev.map(x => x.id === t.id ? { ...x, id: res.id } : x));
      } catch (e) { console.error('addTransaction failed', e); }
    }
  }

  async function updateTx(t) {
    setTransactions(transactions.map(x => x.id === t.id ? t : x));
    try {
      await apiPatch(`/api/transactions/${t.id}`, {
        status: t.status, releasedAt: t.releasedAt, paidAt: t.paidAt,
      });
    } catch (e) { console.error('updateTx failed', e); }
  }

  async function updateUser(u) {
    setUsers(users.map(x => x.id === u.id ? u : x));
    if (u.id !== user.id) return; // só dá pra editar o próprio
    try {
      await apiPatch('/api/me', {
        name: u.name, bio: u.bio, companyName: u.companyName,
        avatarUrl: u.avatarUrl, bannerUrl: u.bannerUrl,
        avatarColor: u.avatarColor, hourlyRate: u.hourlyRate,
        type: u.type, skills: u.skills, experiences: u.experiences,
      });
    } catch (e) { console.error('updateUser failed', e); }
  }

  async function addNotification(userId, text) {
    const newN = { id: uid(), userId, text, createdAt: now(), read: false };
    setNotifications([newN, ...notifications]);
    try {
      const res = await apiPost('/api/notifications', { userId, text });
      setNotifications(prev => prev.map(x => x.id === newN.id ? { ...x, id: res.id } : x));
    } catch (e) { console.error('addNotification failed', e); }
  }

  async function openConversationWith(otherId) {
    if (otherId === user.id) return;
    const existing = conversations.find(c => c.participants.length === 2 && c.participants.includes(user.id) && c.participants.includes(otherId));
    if (existing) { setView({ view:'chat', conversationId: existing.id }); return; }
    try {
      const res = await apiPost('/api/conversations', { otherUserId: otherId });
      const nc = { id: res.id, participants: [user.id, otherId], lastMessage:'', lastAt: now(), messages: [] };
      setConversations([nc, ...conversations]);
      setView({ view:'chat', conversationId: nc.id });
    } catch (e) {
      console.error('openConversationWith failed', e);
      // Fallback: cria localmente mesmo assim
      const nc = { id:'conv_'+uid(), participants:[user.id, otherId], lastMessage:'', lastAt: now(), messages: [] };
      setConversations([nc, ...conversations]);
      setView({ view:'chat', conversationId: nc.id });
    }
  }

  // unread messages count for badge
  const unreadMsgs = conversations
    .filter(c => c.participants.includes(user.id))
    .reduce((sum, c) => sum + c.messages.filter(m => !m.read && m.fromId !== user.id).length, 0);

  let content;
  if (view === 'inicio') content = <Inicio user={user} tasks={tasks} users={users} conversations={conversations} reviews={reviews} setView={setView}/>;
  else if (view === 'mensagens') content = <Mensagens user={user} users={users} conversations={conversations} setConversations={setConversations} setView={setView}/>;
  else if (view === 'chat') content = <ChatView user={user} conversationId={route.conversationId} conversations={conversations} setConversations={setConversations} users={users} setView={setView} addNotification={addNotification}/>;
  else if (view === 'hub') content = <Hub user={user} tasks={tasks} setView={setView}/>;
  else if (view === 'carteira') content = <Financeiro user={user} transactions={transactions} tasks={tasks} updateTx={updateTx} addNotification={addNotification}/>;
  else if (view === 'perfil') content = <PerfilHome user={user} tasks={tasks} transactions={transactions} reviews={reviews} setView={setView} onLogout={async () => { await fetch('/api/auth/logout', {method:'POST', credentials:'include'}); setCurrentUserId(null); location.reload(); }} dark={dark} setDark={setDark}/>;
  else if (view === 'configuracoes') content = <PerfilEdit user={user} updateUser={updateUser} setView={setView}/>;
  else if (view === 'nova') content = <NovaTarefa user={user} addTask={addTask} setView={setView}/>;
  else if (view === 'tarefas') content = <MinhasTarefas user={user} tasks={tasks} setView={setView}/>;
  else if (view === 'tarefasAbertas') content = <TarefasAbertas user={user} tasks={tasks} users={users} setView={setView}/>;
  else if (view === 'tarefa') content = <TarefaDetalhe user={user} taskId={route.taskId} tasks={tasks} updateTask={updateTask}
    addTransaction={addTransaction} addReview={addReview} reviews={reviews} transactions={transactions} users={users}
    addNotification={addNotification} setView={setView}/>;
  else if (view === 'diretorio') content = <Diretorio users={users} reviews={reviews} setView={setView} defaultTab={route.defaultTab} defaultQ={route.defaultQ}/>;
  else if (view === 'perfilPublico') content = <PerfilPublico userId={route.userId} users={users} reviews={reviews} tasks={tasks} currentUser={user} setView={setView} openConversationWith={openConversationWith}/>;
  else content = <Inicio user={user} tasks={tasks} users={users} conversations={conversations} reviews={reviews} setView={setView}/>;

  return (
    <div className="min-h-screen bg-paper dark:bg-black">
      {showOnboarding && <Onboarding onClose={() => { try { localStorage.setItem(onboardingKey, '1'); } catch{}; setShowOnboarding(false); }}/>}
      <header className="sticky top-0 z-20 glass border-b border-black/5 dark:border-white/10">
        <div className="max-w-2xl mx-auto flex items-center justify-between px-4 py-3">
          <div className="flex items-center gap-2">
            <img src="logo.png" alt="Worka+" className="w-9 h-9 rounded-2xl shadow-[0_4px_12px_rgba(16,183,127,0.35)]"/>
            <span className="text-lg font-semibold tracking-tight">Worka<span className="text-brand-500">+</span></span>
          </div>
          <div className="flex items-center gap-1">
            <NotifBell user={user} notifications={notifications} setNotifications={setNotifications}/>
            <button onClick={() => setView('perfil')} className="tappable ml-1">
              <Avatar user={user} size={34}/>
            </button>
          </div>
        </div>
      </header>
      <main className="px-4 py-6 pb-32 max-w-2xl mx-auto">{content}</main>
      <BottomNav view={view} setView={setView} unreadMsgs={unreadMsgs}/>
    </div>
  );
}

function NotifBell({ user, notifications, setNotifications }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  const mine = notifications.filter(n => n.userId === user.id);
  const unread = mine.filter(n => !n.read).length;

  useEffect(() => {
    if (!open) return;
    function onDocClick(e) {
      if (ref.current && !ref.current.contains(e.target)) setOpen(false);
    }
    document.addEventListener('mousedown', onDocClick);
    return () => document.removeEventListener('mousedown', onDocClick);
  }, [open]);

  return (
    <div className="relative" ref={ref}>
      <button
        onClick={() => setOpen(!open)}
        title={unread > 0 ? `${unread} notificação${unread===1?'':'es'} não lida${unread===1?'':'s'}` : 'Notificações'}
        aria-label={unread > 0 ? `${unread} notificações não lidas` : 'Notificações'}
        className="tappable relative w-9 h-9 flex items-center justify-center hover:bg-brand-50 dark:hover:bg-white/10 rounded-full">
        <Icon name="bell" className="w-5 h-5"/>
        {unread > 0 && (
          unread === 1 ? (
            <span className="absolute top-1 right-1 w-2.5 h-2.5 bg-rose-500 rounded-full ring-2 ring-white dark:ring-black animate-pulse"/>
          ) : (
            <span className="absolute -top-0.5 -right-0.5 min-w-[18px] h-[18px] px-1 bg-rose-500 rounded-full text-white text-[10px] font-bold flex items-center justify-center ring-2 ring-white dark:ring-black">
              {unread > 9 ? '9+' : unread}
            </span>
          )
        )}
      </button>
      {open && (
        <div className="absolute right-0 top-12 w-80 glass-strong border border-black/5 dark:border-white/10 rounded-ios shadow-ios-lg z-30 scale-in overflow-hidden">
          <div className="p-3 border-b border-black/5 dark:border-white/10 flex items-center justify-between">
            <p className="font-semibold text-sm">Notificações</p>
            <button className="text-xs font-semibold text-brand-600 dark:text-brand-400" onClick={() => {
              setNotifications(notifications.map(n => n.userId === user.id ? {...n, read:true} : n));
              setOpen(false);
              fetch('/api/notifications', { method:'PATCH', credentials:'include', headers:{'content-type':'application/json'}, body: '{}' }).catch(()=>{});
            }}>Marcar todas</button>
          </div>
          <div className="max-h-80 overflow-y-auto scrollbar">
            {mine.length === 0 ? <p className="p-4 text-sm text-ink/50 dark:text-white/50 text-center">Sem notificações ainda.</p> :
              mine.sort((a,b)=>b.createdAt-a.createdAt).map(n => (
                <div key={n.id} className={`p-3 border-b border-black/5 dark:border-white/10 text-sm ${!n.read?'bg-brand-50/60 dark:bg-brand-500/10':''}`}>
                  <p>{n.text}</p>
                  <p className="text-xs text-ink/50 dark:text-white/50 mt-1">{ago(n.createdAt)}</p>
                </div>
              ))
            }
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<ToastProvider><BootGate /></ToastProvider>);
</script>
</body>
</html>
